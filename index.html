


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Background & Audio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Full-screen background image */
    body {
      background-image: url('https://i.postimg.cc/jq8XL0X2/copy-10909572-510C-42A5-A652-25EA83EE3EF5.jpg'); /* ← Replace with your image */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Transparent box with visible text */
    .text-box {
      background-color: rgba(0, 0, 0, 0.35); /* semi-transparent black */
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 2.5rem 3.5rem;
      max-width: 90%;
      text-align: center;
      backdrop-filter: blur(6px); /* nice frosted-glass effect */
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .text-box h1 {
      color: #ffffff;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.75rem;
    }

    .text-box p {
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.5;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* Audio controls – fixed at bottom so they don’t block the text */
    .audio-controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      padding: 10px 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    .audio-controls button {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .audio-controls button:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .audio-controls .label {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* Hidden audio element */
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Centered text box -->
  <div class="text-box">
    <h1>knot</h1>
    <p>what do you want nigger?<br> </p>
  </div>

  <!-- Audio element – replace 'audio.mp3' with your file -->
  <audio id="bg-audio" loop>
    <source src="https://www.image2url.com/r2/default/audio/1790362075064-5eed798d-0cac-415a-b33b-29925d434e56.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Simple play / pause controls (browsers often block autoplay) -->
  <div class="audio-controls">
    <button id="play-btn" aria-label="Play or pause audio">▶️</button>
    <span class="label" id="status">Click to play audio</span>
  </div>

  <script>
    const audio = document.getElementById('bg-audio');
    const playBtn = document.getElementById('play-btn');
    const status = document.getElementById('status');
    let isPlaying = false;

    // Try to autoplay (many browsers will block this until user interaction)
    audio.play().then(() => {
      isPlaying = true;
      playBtn.textContent = '⏸️';
      status.textContent = 'Playing…';
    }).catch(() => {
      // Autoplay was blocked – wait for user click
      status.textContent = 'play';
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶️';
        status.textContent = 'Paused';
        isPlaying = false;
      } else {
        audio.play().then(() => {
          playBtn.textContent = '⏸️';
          status.textContent = 'Playing…';
          isPlaying = true;
        }).catch(err => {
          status.textContent = 'Could not play – check file name';
          console.error(err);
        });
      }
    });
  </script>
</body>
</html>
